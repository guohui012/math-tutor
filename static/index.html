<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>数学助教</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo"><span class="sig">∑</span> 数学助教</div>
    <div class="sub">严谨计算 · 讲透原理</div>
  </header>

  <main class="wrap">
    <section class="input-card">
      <textarea id="q" rows="3" placeholder="输入数学问题，例如：&#10;解方程 x^2 - 5x + 6 = 0&#10;积分 x*sin(x)&#10;证明 √2 是无理数&#10;解释极限的 ε-δ 定义"></textarea>
      <div class="chips" id="chips"></div>
      <div class="btn-row">
        <button id="btn-both" class="primary">🔢 求解并讲解</button>
        <button id="btn-explain" class="secondary">💡 只讲原理</button>
      </div>
    </section>

    <section class="card" id="compute-card" hidden>
      <h2>① 精确计算（SymPy）</h2>
      <div id="compute-body"></div>
    </section>

    <section class="card" id="explain-card" hidden>
      <h2>② 原理讲解（DeepSeek）</h2>
      <div id="explain-body"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="/static/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
