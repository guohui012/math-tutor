<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>数学助教</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="./katex/katex.min.css">
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1;--accent2:#22d3ee}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
.topbar{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.logo{font-size:20px;font-weight:700}.logo .sig{color:var(--accent2)}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.wrap{max-width:720px;margin:0 auto;padding:12px}
.keybar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.keybar input{flex:1;background:#0b1120;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:13px;font-family:inherit;min-width:0}
.keybar input:focus{outline:none;border-color:var(--accent)}
.keybar button{background:#334155;color:var(--text);border:none;border-radius:10px;padding:9px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.keybar .ks{font-size:12px;color:#4ade80;white-space:nowrap}
.card,.input-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
textarea{width:100%;min-height:96px;resize:vertical;background:#0b1120;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:16px;line-height:1.5;font-family:inherit}
textarea:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:#0b1120;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip:active{background:#243049}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
button.primary,button.secondary{flex:1;padding:13px 10px;font-size:16px;border:none;border-radius:12px;cursor:pointer;font-weight:600;-webkit-tap-highlight-color:transparent}
button.primary{background:var(--accent);color:#fff}button.secondary{background:#334155;color:var(--text)}
button:disabled{opacity:.5;cursor:not-allowed}
.card h2{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:600;letter-spacing:.5px}
.row{margin-bottom:10px}.row:last-child{margin-bottom:0}
.label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.math{font-size:17px;padding:4px 0}.math.result{color:var(--accent2);font-size:19px}
.note{color:#fbbf24;font-size:13px}.muted{color:var(--muted);font-size:12px;margin-top:6px;word-break:break-all}
.err{color:#f87171;font-size:14px;white-space:pre-wrap}.thinking{color:var(--muted);font-style:italic}
.raw-stream{white-space:pre-wrap;color:var(--muted);font-size:14px}
.explain-html{font-size:15px}.explain-html strong{color:#f8fafc}
.explain-html .katex-display{margin:10px 0;overflow-x:auto;overflow-y:hidden}
.katex{color:inherit}
.chat-user{background:#0b1120;border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin:8px 0;color:#a5b4fc;font-size:14px;white-space:pre-wrap}
.chat-assistant{margin:4px 0 14px}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><span class="sig">∑</span> 数学助教</div>
  <div class="sub">严谨计算 · 讲透原理（DeepSeek 直连，无需服务器）</div>
</header>

<main class="wrap">
  <div class="keybar">
    <input id="key" type="password" placeholder="DeepSeek Key（解题讲解，必填）" autocomplete="off">
    <button id="savekey">保存</button>
    <span class="ks" id="keystatus"></span>
  </div>
  <div class="keybar">
    <input id="vkey" type="password" placeholder="阿里云百炼 Key（拍照识别，可选）" autocomplete="off">
    <button id="savevkey">保存</button>
    <span class="ks" id="vkeystatus"></span>
  </div>

  <section class="input-card">
    <textarea id="q" rows="3" placeholder="输入数学问题，例如：&#10;解方程 x^2 - 5x + 6 = 0&#10;积分 exp(-x^2) from 0 to inf&#10;证明 √2 是无理数&#10;解释极限的 ε-δ 定义"></textarea>
    <div class="chips" id="chips"></div>
    <button id="btn-photo" class="secondary" style="width:100%;margin-top:10px">📷 拍照 / 传图识别题目</button>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
    <div class="btn-row">
      <button id="btn-both" class="primary">🔢 求解并讲解</button>
      <button id="btn-explain" class="secondary">💡 只讲原理</button>
      <button id="btn-explore" class="secondary">🧠 思维探索</button>
    </div>
  </section>

  <section class="card" id="explain-card" hidden>
    <h2>讲解与对话（DeepSeek）</h2>
    <div id="explain-body"></div>
  </section>

  <section class="card">
    <h2>💬 对话 / 追问</h2>
    <div id="follow-box">
      <textarea id="follow" rows="2" placeholder="对哪里不明白？或直接问任何数学问题（结合上文上下文）…"></textarea>
      <div class="btn-row"><button id="btn-follow" class="secondary">发送</button></div>
    </div>
  </section>
</main>

<script src="./katex/katex.min.js"></script>
<script>
"use strict";
var qEl=document.getElementById("q"),
    explainCard=document.getElementById("explain-card"),
    explainBody=document.getElementById("explain-body"),btnBoth=document.getElementById("btn-both"),
    btnExplain=document.getElementById("btn-explain"),btnExplore=document.getElementById("btn-explore"),keyEl=document.getElementById("key"),
    saveKey=document.getElementById("savekey"),keyStatus=document.getElementById("keystatus"),
    vkeyEl=document.getElementById("vkey"),saveVKey=document.getElementById("savevkey"),
    vkeyStatus=document.getElementById("vkeystatus"),btnPhoto=document.getElementById("btn-photo"),
    fileInput=document.getElementById("file"),followBox=document.getElementById("follow-box"),
    followEl=document.getElementById("follow"),btnFollow=document.getElementById("btn-follow");

var SYSTEM_PROMPT="你是一位治学严谨的大学数学教授，目标是把数学讲透、帮学生真正理解，而不是只给答案。\n\n请严格遵循：\n1. 严格性：每一步推导都注明依据（定理、定义、恒等变形），不跳步、不臆造、不糊弄。\n2. 思路/方法优先：先讲清这类问题的**总体方法策略**与「为什么往这个方向想」——例如 PDE 常化归为 ODE（分离变量/特征线）、多元化归一元、复杂积分化归已知积分表；讲的是解题思维，不只是机械步骤。\n3. 结构清晰：用 **粗体小标题** 分节，顺序：**方法思想**（这类题的整体策略，讲清「怎么想」） → **详细步骤** → **易错点与推广**。除 **粗体** 和 LaTeX 公式外，不要使用任何 Markdown 语法（不要用 # 标题、- 列表、代码块）。\n4. 公式用 LaTeX：行内 $...$，独立公式 $$...$$。讲解用中文。\n5. 若题目附带了\"计算引擎（SymPy）的精确结果\"，必须以该结果为准讲解；不要自行重算、不要给出与之矛盾的结论。若你判断该结果可疑，明确指出并说明理由。\n6. 主动指出常见概念误区；结尾可给一道同类变式题（不直接给答案）。\n7. 只讲数学本身，不编造来源或引用。";
var SYSTEM_EXPLORE="你现在是一位数学导师，和学生一起「探索数学思维」。\n\n学生可能会提出模糊、奇怪、甚至「说不清哪里奇怪」的问题或直觉（比如「为什么幂级数在某一点的性质似乎决定了全局信息」）。你的任务是：\n1. 先接住这个直觉，帮学生把「感到奇怪的地方」说清楚、说精确。\n2. 点出这个直觉背后对应的正式数学概念/定理并给出名称——例如「你感受到的这个性质叫解析延拓 / 全纯函数的刚性」。\n3. 讲清「为什么会有这种性质」（内在机制），以及它有多强、边界在哪（反例、失效条件）。\n4. 用苏格拉底式引导继续往下想：可追问、可联想相关概念，一步步探索，不要一次性倾倒。\n5. 数学严格，但语气是「一起想」，允许学生表述不精确，你负责把它精确化。\n6. 公式用 LaTeX（$...$ / $$...$$），中文讲解，只用 **粗体** 和 LaTeX，不用其他 Markdown。";

var EXAMPLES=["解方程 x^2 - 5x + 6 = 0","积分 exp(-x^2) from 0 to inf","极限 sin(x)/x as x->0",
  "求导 x*sin(x)","特征值 [[1,2],[3,4]]","行列式 [[1,2],[3,4]]","factorint 2^67 - 1","totient 100",
  "证明 √2 是无理数","为什么幂级数在一点的性质几乎决定了全局信息？","解释极限的 ε-δ 定义"];

// （本地 SymPy 引擎已移除，计算交给 DeepSeek，避免页面卡死）

// ---------- 渲染 ----------
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function renderMath(tex){try{return katex.renderToString(tex,{throwOnError:false});}catch(e){return esc(tex);}}
function renderInline(t){
  var h=esc(t);
  h=h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  h=h.replace(/\$([^$\n]+?)\$|\\\(([^\\\n]+?)\\\)/g,function(f,a,b){
    var s=((a||b||"").trim()).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").replace(/&quot;/g,'"');
    try{return katex.renderToString(s,{throwOnError:false});}catch(e){return f;}
  });
  h=h.replace(/\n/g,"<br>");return h;
}
function renderRich(text){
  var out=[],re=/\$\$([\s\S]*?)\$\$|\\\[([\s\S]*?)\\\]/g,last=0,m;
  while((m=re.exec(text))){
    out.push(renderInline(text.slice(last,m.index)));
    var s=(m[1]||m[2]||"").trim();
    try{out.push(katex.renderToString(s,{displayMode:true,throwOnError:false}));}catch(e){out.push(esc(m[0]));}
    last=m.index+m[0].length;
  }
  out.push(renderInline(text.slice(last)));return out.join("");
}

// ---------- DeepSeek ----------
function getKey(){return (localStorage.getItem("ds_key")||"").trim();}
function buildMessages(query,mode){
  var sys={role:"system",content:(mode==="explore"?SYSTEM_EXPLORE:SYSTEM_PROMPT)},user;
  if(mode==="both"){
    user="问题："+query+"\n\n请先严格地计算/求解（给出完整推导步骤、每一步的依据和最终答案），再讲这类题的方法思想与易错点。";
  }else if(mode==="explore"){
    user="我的一个（可能很模糊的）数学直觉/疑问："+query+"\n\n请陪我一起探索：帮我把这个直觉说清楚，并点出它背后对应的正式概念与更深的追问。";
  }else{
    user="问题："+query+"\n\n请严谨讲解概念、原理、方法思想（先讲整体思路，再讲细节）。";
  }
  return [sys,{role:"user",content:user}];
}
async function streamMessages(messages,onDelta){
  var key=getKey();if(!key)throw new Error("请先在上方填入 DeepSeek API Key");
  var resp=await fetch("https://api.deepseek.com/chat/completions",{
    method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify({model:"deepseek-chat",messages:messages,stream:true,temperature:0.1})
  });
  if(!resp.ok){var t=await resp.text();throw new Error("DeepSeek 返回 "+resp.status+"："+t.slice(0,200));}
  var reader=resp.body.getReader(),decoder=new TextDecoder(),buf="";
  while(true){
    var r=await reader.read();if(r.done)break;
    buf+=decoder.decode(r.value,{stream:true});
    var idx;
    while((idx=buf.indexOf("\n"))!==-1){
      var line=buf.slice(0,idx).trim();buf=buf.slice(idx+1);
      if(line.indexOf("data:")!==0)continue;
      var data=line.slice(5).trim();if(data==="[DONE]")return;
      try{var o=JSON.parse(data);var d=o.choices&&o.choices[0]&&o.choices[0].delta;if(d&&d.content)onDelta(d.content);}catch(e){}
    }
  }
}
var chat=[]; // 完整对话消息列表（含 system 开头）
function appendUser(t){var d=document.createElement("div");d.className="chat-user";d.textContent=t;explainBody.appendChild(d);}
async function streamInto(messages){
  var text="",raw=document.createElement("div");raw.className="raw-stream";explainBody.appendChild(raw);
  try{await streamMessages(messages,function(d){text+=d;raw.textContent=text;});}
  catch(e){raw.textContent="⚠️ "+(e.message||e);return null;}
  raw.remove();
  var el=document.createElement("div");el.className="explain-html";el.innerHTML=text?renderRich(text):"（未返回内容）";
  explainBody.appendChild(el);return text;
}

// ---------- UI ----------
function renderChips(){var c=document.getElementById("chips");EXAMPLES.forEach(function(e){var b=document.createElement("button");b.className="chip";b.textContent=e;b.onclick=function(){qEl.value=e;qEl.focus();};c.appendChild(b);});}
function setLoading(b){btnBoth.disabled=b;btnExplain.disabled=b;btnExplore.disabled=b;}
async function onSubmit(mode){
  var query=qEl.value.trim();if(!query){qEl.focus();return;}
  setLoading(true);
  explainCard.hidden=false;explainBody.innerHTML="";
  chat=buildMessages(query,mode);
  appendUser(query);
  var ans=await streamInto(chat.slice(0));
  if(ans!==null)chat.push({role:"assistant",content:ans});
  setLoading(false);
}
async function onFollowup(){
  var f=followEl.value.trim();if(!f)return;
  followEl.value="";setLoading(true);
  if(chat.length===0){
    explainCard.hidden=false;explainBody.innerHTML="";
    chat=buildMessages(f,"explain");
  }else{
    chat.push({role:"user",content:f});
  }
  appendUser(f);
  var ans=await streamInto(chat.slice(0));
  if(ans!==null)chat.push({role:"assistant",content:ans});
  setLoading(false);
}
btnFollow.onclick=onFollowup;

// ---------- Key 管理 ----------
function refreshKey(){
  var k=getKey();keyEl.value=k;keyStatus.textContent=k?"已保存 ✓":"未设置";
}
saveKey.onclick=function(){localStorage.setItem("ds_key",keyEl.value.trim());refreshKey();};
btnBoth.onclick=function(){onSubmit("both");};
btnExplain.onclick=function(){onSubmit("explain");};
btnExplore.onclick=function(){onSubmit("explore");};

// ---------- 拍照识别（阿里云 Qwen-VL） ----------
function getVKey(){return (localStorage.getItem("ds_vkey")||"").trim();}
function refreshVKey(){var k=getVKey();vkeyEl.value=k;vkeyStatus.textContent=k?"已保存 ✓":"未设置";}
saveVKey.onclick=function(){localStorage.setItem("ds_vkey",vkeyEl.value.trim());refreshVKey();};
btnPhoto.onclick=function(){fileInput.click();};
fileInput.onchange=async function(){
  var f=fileInput.files[0];if(!f)return;
  var vk=getVKey();if(!vk){alert("请先填入上方「阿里云百炼 Key」才能拍照识别");return;}
  qEl.value="正在识别图片…";qEl.disabled=true;
  try{
    var dataUrl=await compressImage(f,1280,0.85);
    var mime=(dataUrl.split(";")[0].split(":")[1]||"image/jpeg");
    var base64=dataUrl.split(",")[1];
    var text=await ocrImage(vk,base64,mime);
    qEl.value=text;qEl.disabled=false;
  }catch(e){qEl.value="";qEl.disabled=false;alert("识别失败："+(e.message||e));}
  fileInput.value="";
};
function compressImage(file,maxW,quality){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,maxW/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.round(w*scale);c.height=Math.round(h*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",quality));
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("图片加载失败"));};
    img.src=url;
  });
}
var OCR_MODELS=["qwen3.7-plus","qwen3.7-max","qwen3-vl-plus"];
async function ocrImage(key,base64,mime){
  var lastErr="";
  for(var i=0;i<OCR_MODELS.length;i++){
    var resp=await fetch("https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions",{
      method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({model:OCR_MODELS[i],messages:[{role:"user",content:[
        {type:"text",text:"识别这张图片里的数学题目，只输出题目本身（用 LaTeX 或纯文本，优先 LaTeX），不要解答、不要任何解释。"},
        {type:"image_url",image_url:{url:"data:"+mime+";base64,"+base64}}
      ]}]})
    });
    if(resp.ok){
      var j=await resp.json();
      var c=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      if(c)return c;
      lastErr="空返回";
    }else{
      var t=await resp.text();
      lastErr="HTTP "+resp.status+"："+t.slice(0,120);
    }
  }
  throw new Error(lastErr||"OCR 失败");
}

refreshKey();refreshVKey();renderChips();
if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister();});});}
</script>
</body>
</html>
